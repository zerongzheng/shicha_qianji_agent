[project]
name = "shichi-qianji-agent"
version = "0.1.0"
description = "时察千机：面向工业多变量时序数据的异常诊断与运维决策智能体"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "fastapi>=0.115.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "uvicorn>=0.34.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
shichi-qianji = "app.cli:main"
shichi-qianji-api = "app.api.server:run"
shichi-qianji-wanwu-check = "app.integrations.wanwu_check:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

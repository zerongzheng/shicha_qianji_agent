services:
  shichi-qianji-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shichi-qianji-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/outputs/shichi_qianji.db
      SKAB_DEFAULT_FILE: /datasets/SKAB/data/valve1/0.csv
      SKAB_DEFAULT_DIR: /datasets/SKAB/data/valve1
      HEALTHY_BASELINE_FILE: /datasets/SKAB/data/anomaly-free/anomaly-free.csv
      # 万悟与本服务加入同一个外部网络后，OpenAPI 直接使用稳定容器名。
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://shichi-qianji-api:8000}
    ports:
      # 默认只允许服务器本机和 SSH 隧道访问；万悟容器通过 wanwu-net 直接调用服务名。
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ${SHICHI_OUTPUT_DIR:-./outputs}:/app/outputs
      - ${SKAB_HOST_DIR:-../SKAB}:/datasets/SKAB:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wanwu-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  wanwu-net:
    name: wanwu-net
    external: true

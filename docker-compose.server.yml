services:
  postgres:
    image: postgres:16
    container_name: shicha-qianji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHICHA_POSTGRES_DB:?set SHICHA_POSTGRES_DB in .env}
      POSTGRES_USER: ${SHICHA_POSTGRES_USER:?set SHICHA_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${SHICHA_POSTGRES_PASSWORD:?set SHICHA_POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - shicha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - shicha-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: shicha-qianji-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: postgresql://${SHICHA_POSTGRES_USER}:${SHICHA_POSTGRES_PASSWORD}@postgres:5432/${SHICHA_POSTGRES_DB}
      DOCKER_DATABASE_URL: postgresql://${SHICHA_POSTGRES_USER}:${SHICHA_POSTGRES_PASSWORD}@postgres:5432/${SHICHA_POSTGRES_DB}
      API_PUBLIC_BASE_URL: http://shicha-qianji-api:8000
      SKAB_DEFAULT_FILE: /app/SKAB/data/valve1/0.csv
      SKAB_DEFAULT_DIR: /app/SKAB/data/valve1
      HEALTHY_BASELINE_FILE: /app/SKAB/data/anomaly-free/anomaly-free.csv
      FRONTEND_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - ./outputs:/app/outputs
      - ./resources:/app/resources:ro
      - ${SKAB_HOST_DIR:-../SKAB}:/app/SKAB:ro
    ports:
      - "127.0.0.1:${SHICHA_API_HOST_PORT:-8000}:8000"
    networks:
      - shicha-net
      - wanwu-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.server
    container_name: shicha-qianji-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${SHICHA_API_HOST_PORT:-8000}
    ports:
      - "127.0.0.1:${SHICHA_FRONTEND_HOST_PORT:-5173}:5173"
    networks:
      - shicha-net

volumes:
  shicha_postgres_data:

networks:
  shicha-net:
  wanwu-net:
    external: true
